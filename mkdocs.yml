site_name: Joonho Wiki
site_url: https://hopefulp.github.io/Joonho-wiki/
site_description: Linux 환경 관리와 VASP 계산을 위한 개인 기술 문서
repo_url: https://github.com/hopefulp/Joonho-wiki
repo_name: hopefulp/Joonho-wiki
edit_uri: edit/main/docs/
docs_dir: docs
theme:
  name: material
  language: ko
  features:
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 어두운 화면으로 전환
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 밝은 화면으로 전환
nav:
  - 홈: index.md
  - Linux: Linux.md
  - VASP: vasp.md
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
  - attr_list
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
